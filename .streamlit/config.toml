# App theme, matched to the colours in src/plotting.py
[theme]
base = "light"
primaryColor = "#2a78d6"             # the plot's blue (repeated dosing line)
backgroundColor = "#fcfcfb"          # same off-white as the plot background
secondaryBackgroundColor = "#f2f1ee" # sidebar and input fields
textColor = "#0b0b0b"
borderColor = "#e6e6e6"              # the plot's grid colour
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.5rem"
showSidebarBorder = true
